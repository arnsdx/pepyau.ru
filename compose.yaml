services:
  app:
    build: .
    init: true
    restart: unless-stopped
    logging: &bounded_logs
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      IMAGES_DIR: /images
      DB_PATH: /var/lib/random-image/catalog.sqlite3
      INDEX_INTERVAL_SECONDS: "${INDEX_INTERVAL_SECONDS:-300}"
    volumes:
      - type: bind
        source: "${IMAGES_DIR:-./images}"
        target: /images
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: catalog
        target: /var/lib/random-image

  nginx:
    image: &nginx_image nginx:1.30.8-alpine
    restart: unless-stopped
    logging: *bounded_logs
    depends_on:
      app:
        condition: service_started
      tls-import:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
      - "${HTTPS_BIND:-${HTTP_BIND:-127.0.0.1}}:${HTTPS_PORT:-8443}:443"
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: tls
        target: /etc/nginx/tls
        read_only: true

  tls-import:
    image: *nginx_image
    entrypoint: ["/bin/sh", "/usr/local/bin/install-tls"]
    command: ["--ensure"]
    volumes:
      - type: bind
        source: ./nginx/install-tls.sh
        target: /usr/local/bin/install-tls
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: tls
        target: /etc/nginx/tls

volumes:
  catalog:
  tls:
    external: true
    name: "${TLS_VOLUME_NAME:-random-image-tls}"
